name: CarScout uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public health endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 20 https://carscout.uk/api/health
      - name: Check public homepage
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 20 --output /dev/null https://carscout.uk/
